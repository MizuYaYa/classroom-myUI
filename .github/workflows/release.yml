name: upload extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: update manifest.json
        run: |
          VERSION=${{ github.ref_name }}
          echo "version: $VERSION"
          sed -i -e "s/\"version\": \".*\"/\"version\": \"${VERSION:1}\"/" src/manifest.json

      - name: zip
        run: |
          zip -r "classroom-myUI_${{ github.ref_name }}.zip" src/

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # 7.0.0
        with:
          client-id: ${{ secrets.CLIENT }}
          client-secret: ${{ secrets.SECRET }}
          refresh-token: ${{ secrets.TOKEN }}
          extension-id: "fldjpemfcmojflhfcgldcbmpeodifbcf"
          file-path: "classroom-myUI_${{ github.ref_name }}.zip"
          publisher-id: ${{ secrets.PUBLISHER }}

      - name: create GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 #2.2.2
        with:
          generate_release_notes: true
          files: classroom-myUI_${{ github.ref_name }}.zip

      - name: delete zip
        run: |
          rm classroom-myUI_${{ github.ref_name }}.zip

      - name: create pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e
        with:
          commit-message: "🔖 Release ${{ github.ref_name }}"
          title: "🔖 Release ${{ github.ref_name }}"
          body: "🔖 Release ${{ github.ref_name }}"
          base: main
          branch: release/${{ github.ref_name }}
          labels: release
